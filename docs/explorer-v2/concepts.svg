<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420"><rect width="1200" height="420" fill="#edf4f1"/><title>Three Habit Explorer layout concepts</title><g font-family="sans-serif" fill="#143c35"><rect x="20" y="20" width="375" height="380" rx="18" fill="white" stroke="#317467"/><text x="36" y="53" font-size="18">A · Existing 3D, calmer layout</text><rect x="35" y="75" width="345" height="50" rx="8" fill="#dbece5"/><text x="45" y="105" font-size="15">Guided header · four habits</text><rect x="35" y="145" width="345" height="150" rx="12" fill="#e8efed"/><text x="45" y="225" font-size="15">Existing 3D + visible metaphor key</text><text x="35" y="335" font-size="14">Contextual lesson · optional drawer</text><text x="35" y="370" font-size="13">Settings → requested, never permanent</text></g><g font-family="sans-serif" fill="#143c35"><rect x="415" y="20" width="375" height="380" rx="18" fill="white" stroke="#317467"/><text x="431" y="53" font-size="18">B · New lightweight 3D</text><rect x="430" y="75" width="345" height="50" rx="8" fill="#dbece5"/><text x="440" y="105" font-size="15">Guided header · four habits</text><rect x="430" y="145" width="345" height="150" rx="12" fill="#e8efed"/><text x="440" y="225" font-size="15">New sparse model (concept only)</text><text x="430" y="335" font-size="14">New asset/model validation required</text><text x="430" y="370" font-size="13">Settings → requested, never permanent</text></g><g font-family="sans-serif" fill="#143c35"><rect x="810" y="20" width="375" height="380" rx="18" fill="white" stroke="#317467"/><text x="826" y="53" font-size="18">C · 2D first, optional 3D ✓</text><rect x="825" y="75" width="345" height="50" rx="8" fill="#dbece5"/><text x="835" y="105" font-size="15">Guided header · four habits</text><rect x="825" y="145" width="345" height="150" rx="12" fill="#e8efed"/><text x="835" y="225" font-size="15">Labelled beginning/current values</text><text x="825" y="335" font-size="14">One flowing lesson · optional drawer</text><text x="825" y="370" font-size="13">Settings → requested, never permanent</text></g></svg>