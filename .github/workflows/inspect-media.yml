name: Inspect supplied hummingbird media
on:
  pull_request:
    paths:
      - '.github/workflows/inspect-media.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install media inspection tool
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Prepare opaque video and matching still
        shell: python
        run: |
          import subprocess, json, base64, hashlib
          source = 'public/media/healthcrest-hummingbird.webm'
          subprocess.run(['ffmpeg','-v','error','-c:v','libvpx-vp9','-i',source,'-vf','scale=960:-2,format=yuv420p','-c:v','libvpx-vp9','-deadline','good','-cpu-used','4','-threads','2','-crf','30','-b:v','0','-an','/tmp/hummingbird-opaque.webm'],check=True)
          subprocess.run(['ffmpeg','-v','error','-ss','4.986','-i','/tmp/hummingbird-opaque.webm','-frames:v','1','-q:v','3','/tmp/hummingbird-still.jpg'],check=True)
          # Compare the original transparency on the actual light page background.
          original = subprocess.check_output(['ffmpeg','-v','error','-c:v','libvpx-vp9','-ss','4.986','-i',source,'-filter_complex','[0:v]format=rgba[fg];color=c=0xf8f7f0:s=1280x720[bg];[bg][fg]overlay=shortest=1,scale=480:-2','-frames:v','1','-f','image2pipe','-vcodec','mjpeg','-'])
          print('MEDIA_ORIGINAL_LIGHT=' + base64.b64encode(original).decode())
          for kind, path in [('VIDEO','/tmp/hummingbird-opaque.webm'),('POSTER','/tmp/hummingbird-still.jpg')]:
              data = open(path,'rb').read()
              print('MEDIA_INFO_' + kind + '=' + json.dumps({'bytes':len(data),'blob_sha':hashlib.sha1(b'blob '+str(len(data)).encode()+b'\x00'+data).hexdigest()}))
              encoded = base64.b64encode(data).decode()
              for offset in range(0,len(encoded),24000):
                  print('MEDIA_DATA_' + kind + '_' + str(offset//24000).zfill(4) + '=' + encoded[offset:offset+24000])
          print('MEDIA_OUTPUT_METADATA=' + subprocess.check_output(['ffprobe','-v','quiet','-show_streams','-of','json','/tmp/hummingbird-opaque.webm']).decode().replace('\n',''))
