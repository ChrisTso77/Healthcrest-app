name: Health Engine CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit Production Dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run TypeScript Compiler Check
        run: npx tsc --noEmit

      - name: Run ESLint
        run: npm run lint

      - name: Run Unit Tests
        run: npm run test:unit

  validate-cms-seed:
    name: Validate CMS Seed JSON
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Validate JSON Syntax
        run: |
          node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('pillars-seed-data-v3.json', 'utf8'));
            console.log('Successfully validated pillars-seed-data-v3.json syntax.');
            console.log(\`Pillars: \${data.pillars.length}, Evidence: \${data.evidenceItems.length}, Presets: \${data.scenarioPresets.length}\`);
          "

  playwright-e2e:
    name: Playwright E2E & WebGL Tests
    needs: [lint-and-typecheck, validate-cms-seed]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HEALTHCREST_TELEMETRY_ENABLED: 'true'
      VERCEL_ENV: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers & Dependencies
        run: npx playwright install --with-deps chromium

      - name: Build Next.js Application
        run: npm run build
        env:
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET: ${{ secrets.NEXT_PUBLIC_SANITY_DATASET }}

      - name: Run Playwright E2E Test Suite
        run: npx playwright test
        env:
          CI: true

      - name: Audit mobile front-door performance
        run: node scripts/mobile-performance.mjs

      - name: Upload mobile performance reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mobile-performance
          path: artifacts/mobile-performance/
          retention-days: 14

      - name: Upload Playwright Test Report on Failure
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  measurement-preview-off:
    name: Measurement disabled on previews
    needs: [lint-and-typecheck, validate-cms-seed]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HEALTHCREST_TELEMETRY_ENABLED: 'true'
      VERCEL_ENV: preview
      HEALTHCREST_TEST_MEASUREMENT_OFF: '1'
      CI: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
      - name: Build preview profile
        run: npm run build
        env:
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET: ${{ secrets.NEXT_PUBLIC_SANITY_DATASET }}
      - name: Verify preview default-off boundary
        run: npx playwright test
      - name: Upload preview-profile report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: measurement-off-report
          path: playwright-report/
          retention-days: 14
