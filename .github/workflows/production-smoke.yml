name: Healthcrest protected Preview verification

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Approved separate Planner review-fix SHA; PR140 unchanged; does not deploy
        required: true
        type: string

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      deployments: read
      id-token: write
    env:
      HEALTHCREST_RELEASE_ORIGIN: https://healthcrest-55j1i65dz-tsotsoft.vercel.app
      HEALTHCREST_EXPECTED_COMMIT: e6bd9d793f034c6d7a1df4334ea869c1782ec20a
    steps:
      - name: Require approved manual trusted branch and exact Planner target
        env:
          REQUESTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          python3 - <<'PY'
          import os
          expected = {
              'GITHUB_EVENT_NAME': 'workflow_dispatch',
              'GITHUB_REPOSITORY': 'ChrisTso77/Healthcrest-app',
              'GITHUB_REF': 'refs/heads/codex/healthcrest-preview-auth',
              'GITHUB_WORKFLOW': 'Healthcrest protected Preview verification',
              'REQUESTED_COMMIT': 'e6bd9d793f034c6d7a1df4334ea869c1782ec20a',
          }
          assert all(os.environ.get(k) == v for k, v in expected.items()), 'Unapproved verification context'
          PY
      - name: Checkout trusted verification harness
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked verification dependencies without lifecycle hooks
        run: npm ci --ignore-scripts
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ''
          ACTIONS_ID_TOKEN_REQUEST_URL: ''
      - name: Check authentication boundaries only
        run: node --test scripts/protected-preview-auth.test.mjs
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ''
          ACTIONS_ID_TOKEN_REQUEST_URL: ''
      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ''
          ACTIONS_ID_TOKEN_REQUEST_URL: ''
      - name: Confirm deployment provenance and acquire short-lived identity
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const sha = 'e6bd9d793f034c6d7a1df4334ea869c1782ec20a';
            const origin = 'https://healthcrest-55j1i65dz-tsotsoft.vercel.app';
            if (context.eventName !== 'workflow_dispatch' || process.env.GITHUB_REF !== 'refs/heads/codex/healthcrest-preview-auth' ||
                context.repo.owner !== 'ChrisTso77' || context.repo.repo !== 'Healthcrest-app') throw new Error('Unapproved identity request');
            const args = { ...context.repo, deployment_id: 7769985368 };
            const deployment = (await github.rest.repos.getDeployment(args)).data;
            const statuses = (await github.rest.repos.listDeploymentStatuses(args)).data;
            if (deployment.sha !== sha || deployment.environment !== 'Preview' || deployment.production_environment === true ||
                statuses[0]?.state !== 'success' || statuses[0]?.environment_url !== origin) throw new Error('Preview provenance changed');
            const token = await core.getIDToken('https://github.com/ChrisTso77');
            core.setSecret(token);
            core.setOutput('token', token);
      - name: Verify authenticated Planner Preview confidentiality
        run: node scripts/check-planner-preview.mjs
        env:
          HEALTHCREST_PREVIEW_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ''
          ACTIONS_ID_TOKEN_REQUEST_URL: ''
      - name: Preserve sanitized protected Preview report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: protected-preview-release-readiness
          path: artifacts/release-readiness/
          if-no-files-found: error
          retention-days: 14
