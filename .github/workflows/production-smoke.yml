name: Production release smoke check

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Full merged main commit SHA expected on the live domain
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    name: Check live Healthcrest release
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      HEALTHCREST_RELEASE_ORIGIN: https://www.healthcrest.uk
      HEALTHCREST_EXPECTED_COMMIT: ${{ inputs.expected_commit }}
      HEALTHCREST_REQUIRE_MAIN: '1'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify live public pages and recovery
        run: npm run test:release
      - name: Upload release readiness report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: production-release-readiness
          path: artifacts/release-readiness/
          retention-days: 14
